<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>MineFun Clone</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="instructions">اضغط على الشاشة لبدء اللعب (WASD للتحرك - الماوس للنظر)</div>

  <script>
    // 1. إعداد المشهد والكاميرا
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // لون السماء

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. إضاءة المشهد
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 3. أدوات التحكم (Pointer Lock)
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');

    document.body.addEventListener('click', () => {
      controls.lock();
    });

    controls.addEventListener('lock', () => {
      instructions.style.display = 'none';
    });

    controls.addEventListener('unlock', () => {
      instructions.style.display = '';
    });

    // 4. توليد خريطة الماين كرافت (مكعبات)
    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x557a2b });
    const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

    const worldSize = 16;
    for (let x = -worldSize; x < worldSize; x++) {
      for (let z = -worldSize; z < worldSize; z++) {
        // العشب العشبي العلوي
        const block = new THREE.Mesh(boxGeometry, grassMaterial);
        block.position.set(x, 0, z);
        scene.add(block);

        // الطبقة السفلية (تراب)
        const subBlock = new THREE.Mesh(boxGeometry, dirtMaterial);
        subBlock.position.set(x, -1, z);
        scene.add(subBlock);
      }
    }

    // 5. حركات اللاعب
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    document.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    });

    camera.position.y = 2; // ارتفاع الكاميرا (مستوى العين)

    // 6. حلقة التحديث (Animation Loop)
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (controls.isLocked) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    animate();

    // تعديل الشاشة عند تغيير الحجم
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html
