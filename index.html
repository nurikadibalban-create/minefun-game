<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineFun.io Full Interface</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header class="top-bar">
    <div class="profile-container">
      <div class="profile-card">
        <div class="avatar-icon"></div>
        <span class="username" id="display-name">NURIPLAYZ</span>
      </div>
      <div class="sub-profile-btns">
        <div class="wheel-btn">🎡</div>
        <div class="gift-btn">🎁 <span class="badge-free">FREE</span></div>
        <button class="friends-btn">👥 FRIENDS</button>
      </div>
    </div>
    <div class="logo">MINEFUN<span>.io</span></div>
    <div class="top-menu">
      <button class="icon-btn">📥</button>
      <button class="nav-btn shop-btn">🛒 SHOP</button>
      <button class="nav-btn pets-btn">🐾 PETS</button>
      <button class="icon-btn">⚙️</button>
    </div>
  </header>

  <div class="main-container">
    <div class="viewport-section" id="canvas-container">
      <div class="player-nametag">NURIPLAYZ</div>
      <div class="ad-banner">
        <div class="ad-header">Acrobat Bunu Başardı.</div>
        <div class="ad-body">
          <p>Ücretsiz denemeyi başlat</p>
          <button class="ad-btn">Send</button>
        </div>
        <div class="ad-footer">Adobe Acrobat Pro</div>
      </div>
    </div>

    <div class="games-section">
      <div class="games-grid">
        <div class="game-card popular"><span class="badge popular-badge">POPULAR</span><div class="card-title">INFECTION</div></div>
        <div class="game-card"><div class="card-title">PARKOUR</div></div>
        <div class="game-card"><div class="card-title">CREATIVE</div></div>
        <div class="game-card"><div class="card-title">HIDE AND SEEK</div></div>
        <div class="game-card"><div class="card-title">THE WAR</div></div>
        <div class="game-card"><div class="card-title">SKY WARS</div></div>
        <div class="game-card"><div class="card-title">ONE BLOCK</div></div>
        <div class="game-card"><div class="card-title">BED WARS</div></div>
        <div class="game-card"><div class="card-title">SANDBOX</div></div>
        <div class="game-card"><div class="card-title">RAID</div></div>
        <div class="game-card updated"><span class="badge updated-badge">UPDATED</span><div class="card-title">STEAL A PET</div></div>
        <div class="game-card"><div class="card-title">DRESS UP</div></div>
        <div class="custom-games-box">
          <div class="custom-title">CUSTOM GAMES</div>
          <div class="custom-icons">🎮 🎲 ⚔️</div>
        </div>
        <div class="game-card updated"><span class="badge updated-badge">UPDATED</span><div class="card-title">GARDEN GROW</div></div>
        <div class="game-card coming-soon"><div class="card-title">COMING SOON</div></div>
        <div class="game-card coming-soon"><div class="card-title">COMING SOON</div></div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    const islandGroup = new THREE.Group();
    const grassGeo = new THREE.CylinderGeometry(3, 2.5, 0.8, 8);
    const grassMat = new THREE.MeshBasicMaterial({ color: 0x557a2b });
    islandGroup.add(new THREE.Mesh(grassGeo, grassMat));

    const dirtGeo = new THREE.CylinderGeometry(2.5, 0.5, 2.5, 8);
    const dirtMat = new THREE.MeshBasicMaterial({ color: 0x8b5a2b });
    const dirt = new THREE.Mesh(dirtGeo, dirtMat);
    dirt.position.y = -1.55;
    islandGroup.add(dirt);

    // دالة إنشاء مكعب مع ضبط الـ UV لتوزيع التكستشر بشكل صحيح
    function createBox(w, h, d, u, v, texture, texW = 64, texH = 64) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });

      const uvs = [];
      const faces = [
        [u + d + w, v + d, u + d + w + d, v + d + h], // Right
        [u, v + d, u + d, v + d + h],                 // Left
        [u + d, v, u + d + w, v + d],                 // Top
        [u + d + w, v, u + d + w + w, v + d],         // Bottom
        [u + d, v + d, u + d + w, v + d + h],         // Front
        [u + d + w + d, v + d, u + 2*d + 2*w, v + d + h] // Back
      ];

      for (let i = 0; i < 6; i++) {
        const [x1, y1, x2, y2] = faces[i];
        uvs.push(
          x1/texW, 1 - y2/texH,
          x2/texW, 1 - y2/texH,
          x1/texW, 1 - y1/texH,
          x2/texW, 1 - y1/texH
        );
      }
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return new THREE.Mesh(geo, mat);
    }

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // رابط سكن Steve المباشر كصورة Canvas خفيفة وقابلة للتحميل بدون مشاكل
    const skinUrl = 'https://mc-heads.net/skin/MHF_Steve';

    textureLoader.load(skinUrl, (texture) => {
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;

      const playerGroup = new THREE.Group();

      // Head
      const head = createBox(0.8, 0.8, 0.8, 8, 8, texture);
      head.position.y = 1.8;
      playerGroup.add(head);

      // Body
      const body = createBox(0.8, 1.2, 0.4, 20, 20, texture);
      body.position.y = 0.8;
      playerGroup.add(body);

      // Left Arm
      const leftArm = createBox(0.4, 1.2, 0.4, 44, 20, texture);
      leftArm.position.set(-0.6, 0.8, 0);
      playerGroup.add(leftArm);

      // Right Arm
      const rightArm = createBox(0.4, 1.2, 0.4, 44, 20, texture);
      rightArm.position.set(0.6, 0.8, 0);
      playerGroup.add(rightArm);

      // Left Leg
      const leftLeg = createBox(0.4, 1.2, 0.4, 4, 20, texture);
      leftLeg.position.set(-0.2, -0.4, 0);
      playerGroup.add(leftLeg);

      // Right Leg
      const rightLeg = createBox(0.4, 1.2, 0.4, 4, 20, texture);
      rightLeg.position.set(0.2, -0.4, 0);
      playerGroup.add(rightLeg);

      islandGroup.add(playerGroup);
    });

    scene.add(islandGroup);

    camera.position.set(0, 2, 6);
    camera.lookAt(0, 0.5, 0);

    function animate() {
      requestAnimationFrame(animate);
      islandGroup.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
