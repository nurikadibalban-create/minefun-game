<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFun Game - full</title>
    <!-- Three.js library for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1c23;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Header UI */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(37, 40, 54, 0.9);
            padding: 10px 20px;
            border-bottom: 3px solid #3b3e51;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px #000;
        }

        .nav-buttons button {
            background-color: #4e5473;
            color: white;
            border: none;
            padding: 8px 14px;
            margin: 0 3px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-buttons button:hover, .nav-buttons button.active {
            background-color: #ff9d00;
            color: #000;
        }

        /* Canvas area */
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Overlay UI panels */
        .panel-overlay {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 100px);
            background: rgba(31, 34, 46, 0.95);
            border-radius: 10px;
            padding: 15px;
            display: none;
            z-index: 20;
            overflow-y: auto;
            border: 2px solid #ff9d00;
        }

        .panel-overlay.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            background-color: #2c3040;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #4e5473;
        }

        .card:hover {
            border-color: #ff9d00;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MINEFUN.IO</div>
        <div class="nav-buttons">
            <button onclick="togglePanel('lobby')" class="active">اللوبي (Lobby)</button>
            <button onclick="togglePanel('custom')">كاستم جيم (Custom)</button>
            <button onclick="togglePanel('shop')">الشوب (Shop)</button>
            <button onclick="togglePanel('pets')">Pets</button>
        </div>
    </header>

    <div class="crosshair"></div>

    <div class="instructions">
        💡 **التحكم:** اضغط بالماوس على الشاشة لتدوير الكاميرا.<br>
        • **النقر الأيسر:** حذف/تكسير البلوكة.<br>
        • **زر ESC:** للخروج من الكاميرا.
    </div>

    <!-- UI Panels -->
    <div id="lobby" class="panel-overlay active">
        <h3>أنماط اللوبي</h3>
        <div class="grid-container">
            <div class="card">Infection</div>
            <div class="card">Parkour</div>
            <div class="card">Bed Wars</div>
            <div class="card">Sky Wars</div>
        </div>
    </div>

    <div id="custom" class="panel-overlay">
        <h3>ألعاب مخصصة</h3>
        <div class="grid-container">
            <div class="card">Squid Game</div>
            <div class="card">Lucky Block</div>
        </div>
    </div>

    <div id="shop" class="panel-overlay">
        <h3>الشوب والمحل</h3>
        <div class="grid-container">
            <div class="card">سكن ستيف</div>
            <div class="card">نظارة 80🪙</div>
        </div>
    </div>

    <div id="pets" class="panel-overlay">
        <h3>متجر الحيوانات</h3>
        <div class="grid-container">
            <div class="card">بيضة عادية</div>
            <div class="card">تنين</div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        // 1. UI Panel Logic
        function togglePanel(panelId) {
            const panels = document.querySelectorAll('.panel-overlay');
            panels.forEach(p => {
                if(p.id === panelId) {
                    p.classList.toggle('active');
                } else {
                    p.classList.remove('active');
                }
            });
        }

        // 2. Three.js Engine & World Generation
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 15).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Create Voxel Terrain (Blocks)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0x47c358 });
        const blocks = [];

        // Spawn Floor Blocks
        for (let x = -5; x <= 5; x++) {
            for (let z = -5; z <= 5; z++) {
                const block = new THREE.Mesh(geometry, material);
                block.position.set(x, 0, z);
                scene.add(block);
                blocks.push(block);
            }
        }

        camera.position.set(0, 3, 8);
        camera.lookAt(0, 0, 0);

        // 3. First-Person Camera Controls & Pointer Lock
        let isLocked = false;
        const canvas = document.getElementById('game-canvas');

        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === canvas);
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        // 4. Break Blocks Logic (Raycasting)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center of screen

        window.addEventListener('mousedown', (e) => {
            if (!isLocked || e.button !== 0) return; // Left Click

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const hitBlock = intersects[0].object;
                scene.remove(hitBlock);
                const index = blocks.indexOf(hitBlock);
                if (index > -1) blocks.splice(index, 1);
            }
        });

        // Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
