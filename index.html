<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineFun.io Clone</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 1. الشريط العلوي Top Navigation Bar -->
  <header class="top-bar">
    <div class="profile-section">
      <div class="avatar-icon"></div>
      <div class="player-info">
        <span class="username" id="display-name">NURIPLAYZ</span>
        <span class="status-tag">LOADING...</span>
      </div>
    </div>

    <div class="logo">MINEFUN<span>.io</span></div>

    <div class="top-menu">
      <button class="nav-btn shop-btn">🛒 SHOP</button>
      <button class="nav-btn pets-btn">🐾 PETS</button>
      <button class="icon-btn">⚙️</button>
    </div>
  </header>

  <!-- 2. جسم اللعبة الأساسي Split Layout -->
  <div class="main-container">
    
    <!-- الجانب الأيسر: عرض السكن بـ 3D -->
    <div class="viewport-section" id="canvas-container">
      <div class="player-nametag">NURIPLAYZ</div>
    </div>

    <!-- الجانب الأيمن: قائمة المودات Modes Grid -->
    <div class="games-section">
      <div class="games-grid">
        
        <div class="game-card popular">
          <span class="badge popular-badge">POPULAR</span>
          <div class="card-title">INFECTION</div>
        </div>

        <div class="game-card">
          <div class="card-title">PARKOUR</div>
        </div>

        <div class="game-card">
          <div class="card-title">CREATIVE</div>
        </div>

        <div class="game-card">
          <div class="card-title">HIDE AND SEEK</div>
        </div>

        <div class="game-card">
          <div class="card-title">THE WAR</div>
        </div>

        <div class="game-card">
          <div class="card-title">SKY WARS</div>
        </div>

        <div class="game-card">
          <div class="card-title">ONE BLOCK</div>
        </div>

        <div class="game-card">
          <div class="card-title">BED WARS</div>
        </div>

        <div class="game-card">
          <div class="card-title">SANDBOX</div>
        </div>

        <div class="game-card">
          <div class="card-title">RAID</div>
        </div>

        <div class="game-card updated">
          <span class="badge updated-badge">UPDATED</span>
          <div class="card-title">STEAL A PET</div>
        </div>

        <div class="game-card">
          <div class="card-title">DRESS UP</div>
        </div>

        <div class="game-card updated">
          <span class="badge updated-badge">UPDATED</span>
          <div class="card-title">GARDEN GROW</div>
        </div>

        <div class="game-card coming-soon">
          <div class="card-title">COMING SOON</div>
        </div>

        <div class="game-card coming-soon">
          <div class="card-title">COMING SOON</div>
        </div>

      </div>
    </div>
  </div>

  <!-- 3. كود بناء المجسم والجزيرة (Three.js) -->
  <script>
    const container = document.getElementById('canvas-container');
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // بناء الجزيرة العائمة
    const islandGroup = new THREE.Group();
    
    const grassGeo = new THREE.CylinderGeometry(3, 2.5, 0.8, 8);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    islandGroup.add(grass);

    const dirtGeo = new THREE.CylinderGeometry(2.5, 0.5, 2.5, 8);
    const dirtMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
    const dirt = new THREE.Mesh(dirtGeo, dirtMat);
    dirt.position.y = -1.55;
    islandGroup.add(dirt);

    // مجسم الشخصية
    const characterGroup = new THREE.Group();
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
    head.position.y = 1.8;
    characterGroup.add(head);

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), bodyMat);
    body.position.y = 0.8;
    characterGroup.add(body);

    islandGroup.add(characterGroup);
    scene.add(islandGroup);

    camera.position.set(0, 2.5, 7);
    camera.lookAt(0, 0.5, 0);

    function animate() {
      requestAnimationFrame(animate);
      islandGroup.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
