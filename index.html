<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineFun Clone - Lobby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }

    /* القائمة الرئيسية */
    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; color: white;
    }

    .title { font-size: 42px; font-weight: 900; color: #38bdf8; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }

    .menu-box {
      background: rgba(30, 41, 59, 0.9); border: 2px solid #334155; border-radius: 16px;
      padding: 24px; width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    input[type="text"] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: white; text-align: center; font-size: 16px; margin-bottom: 15px;
    }

    .mode-select {
      display: flex; gap: 8px; margin-bottom: 15px; justify-content: center;
    }

    .mode-btn {
      flex: 1; padding: 8px; background: #334155; border: 2px solid transparent;
      border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 13px;
    }

    .mode-btn.active { border-color: #38bdf8; background: #0284c7; }

    .play-btn {
      width: 100%; padding: 12px; background: #22c55e; border: none; border-radius: 8px;
      color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .play-btn:hover { background: #16a34a; }

    /* HUD اللعبة */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      background: white; border: 2px solid black; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none;
    }

    #game-info {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6);
      color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; z-index: 10; display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <!-- القائمة الرئيسية -->
  <div id="menu-overlay">
    <div class="title">MINEFUN 3D</div>
    <div class="menu-box">
      <input type="text" id="username" value="Steve_Pro" placeholder="ادخل اسمك">
      
      <div style="font-size: 14px; margin-bottom: 8px; color: #94a3b8;">اختر المود:</div>
      <div class="mode-select">
        <button class="mode-btn active" onclick="selectMode(this, 'BedWars')">BedWars</button>
        <button class="mode-btn" onclick="selectMode(this, 'SkyWars')">SkyWars</button>
        <button class="mode-btn" onclick="selectMode(this, 'Parkour')">Parkour</button>
      </div>

      <button class="play-btn" onclick="startGame()">دخول اللعبة</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="game-info">المود: <span id="current-mode">BedWars</span> | اللاعب: <span id="player-name">--</span></div>

  <script>
    let selectedMode = 'BedWars';

    function selectMode(btn, mode) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMode = mode;
    }

    // 1. المشهد
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. نموذج مجسم للاعب (Skin)
    const playerGroup = new THREE.Group();
    
    // الرأس
    const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.25;
    playerGroup.add(head);

    // الجسم
    const bodyGeo = new THREE.BoxGeometry(0.5, 0.75, 0.25);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // قميص أزرق
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.625;
    playerGroup.add(body);

    scene.add(playerGroup);
    playerGroup.position.set(0, 0, -3); // عرض السكن أمام الكاميرا القائمة

    // 3. الخريطة
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });

    for (let x = -8; x < 8; x++) {
      for (let z = -8; z < 8; z++) {
        const block = new THREE.Mesh(boxGeo, grassMat);
        block.position.set(x, -1, z);
        scene.add(block);
      }
    }

    camera.position.set(0, 1, 0);

    // 4. التحكم ببدء اللعبة
    const controls = new THREE.PointerLockControls(camera, document.body);

    function startGame() {
      const name = document.getElementById('username').value || 'Player';
      document.getElementById('player-name').innerText = name;
      document.getElementById('current-mode').innerText = selectedMode;

      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('crosshair').style.display = 'block';
      document.getElementById('game-info').style.display = 'block';

      scene.remove(playerGroup); // إخفاء عرض السكن للتحول لمنظور الشخص الأول
      controls.lock();
    }

    controls.addEventListener('unlock', () => {
      document.getElementById('menu-overlay').style.display = 'flex';
      document.getElementById('crosshair').style.display = 'none';
      document.getElementById('game-info').style.display = 'none';
      scene.add(playerGroup);
    });

    // 5. حلقة التدوير
    function animate() {
      requestAnimationFrame(animate);

      // تدوير السكن في القائمة
      if (playerGroup) {
        playerGroup.rotation.y += 0.01;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
