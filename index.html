<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFun.io - Play Free Online Games</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
            user-select: none;
        }

        body {
            background-color: #177a9e;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 3D Background Canvas */
        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Full Overlay UI Container */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Header UI */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 20px;
        }

        /* Profile Widget (Top-Left) */
        .profile-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-tag {
            background: #000;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #333;
        }

        .friends-btn {
            background: #324b6f;
            color: #fff;
            border: 2px solid #5275a1;
            border-bottom: 4px solid #1a2a40;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Header Right Controls */
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 38px;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            letter-spacing: 0px;
            margin-right: 15px;
        }

        .logo span {
            color: #00d2ff;
        }

        .nav-btn {
            background: #232733;
            color: #fff;
            border: 2px solid #3d4357;
            border-bottom: 4px solid #12141c;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: #313747;
        }

        .btn-shop { background: #2f364a; }
        .btn-pets { background: #2f364a; }

        /* Main Center Layout */
        .main-body {
            display: flex;
            justify-content: flex-end;
            padding: 0 20px 20px 0;
            height: calc(100vh - 80px);
        }

        /* Games Grid Panel */
        .games-panel {
            width: 680px;
            background: rgba(18, 30, 49, 0.92);
            border-radius: 16px;
            padding: 16px;
            border: 4px solid #283a54;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .game-card {
            position: relative;
            background: #1c2838;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 2px solid #324663;
            border-bottom: 4px solid #0f1724;
            overflow: hidden;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .game-card:hover {
            transform: scale(1.04);
            border-color: #00d2ff;
        }

        .game-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title {
            position: relative;
            z-index: 2;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            padding: 6px 2px 3px 2px;
            text-align: center;
            font-size: 10px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 1px 1px 0 #000;
        }

        .badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #ffcc00;
            color: #000;
            font-size: 8px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 900;
            z-index: 3;
        }

        .badge-updated {
            background: #00d2ff;
            color: #000;
        }

        /* Custom Games Section Banner */
        .custom-games-row {
            display: flex;
            gap: 8px;
            background: #162233;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #2d415e;
        }

        .custom-label {
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            font-size: 10px;
            font-weight: 900;
            color: #8fa3c4;
            text-align: center;
            letter-spacing: 1px;
        }

        .custom-item {
            flex: 1;
            height: 60px;
            background: #23344d;
            border-radius: 6px;
            border: 2px solid #374e70;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .custom-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Custom Scrollbar */
        .games-panel::-webkit-scrollbar {
            width: 8px;
        }
        .games-panel::-webkit-scrollbar-thumb {
            background: #2b3d57;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background (Islands & Player) -->
    <canvas id="canvas-3d"></canvas>

    <!-- Overlay UI -->
    <div class="ui-overlay">
        
        <!-- Header -->
        <div class="header">
            <div class="profile-box interactive">
                <div class="user-tag">
                    <span style="color:#00ff88; font-size:10px;">🟢</span>
                    NURIPLAYZ
                </div>
                <button class="friends-btn">👥 FRIENDS</button>
            </div>

            <div class="header-right interactive">
                <div class="logo">Mine<span>Fun</span>.io</div>
                <button class="nav-btn btn-shop">🛒 SHOP</button>
                <button class="nav-btn btn-pets">🐾 PETS</button>
                <button class="nav-btn">⚙️</button>
            </div>
        </div>

        <!-- Main Body -->
        <div class="main-body">
            <div class="games-panel interactive">
                
                <!-- Main Grid -->
                <div class="games-grid">
                    
                    <div class="game-card">
                        <span class="badge">POPULAR</span>
                        <img src="https://picsum.photos/id/1062/150/150" alt="Infection">
                        <div class="game-title">INFECTION</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1015/150/150" alt="Parkour">
                        <div class="game-title">PARKOUR</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1018/150/150" alt="Creative">
                        <div class="game-title">CREATIVE</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1025/150/150" alt="Hide and Seek">
                        <div class="game-title">HIDE AND SEEK</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1043/150/150" alt="The War">
                        <div class="game-title">THE WAR</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1050/150/150" alt="Sky Wars">
                        <div class="game-title">SKY WARS</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1058/150/150" alt="One Block">
                        <div class="game-title">ONE BLOCK</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1069/150/150" alt="Bed Wars">
                        <div class="game-title">BED WARS</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1080/150/150" alt="Sandbox">
                        <div class="game-title">SANDBOX</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1084/150/150" alt="Raid">
                        <div class="game-title">RAID</div>
                    </div>

                    <div class="game-card">
                        <span class="badge badge-updated">UPDATED</span>
                        <img src="https://picsum.photos/id/1074/150/150" alt="Steal a Pet">
                        <div class="game-title">STEAL A PET</div>
                    </div>

                    <div class="game-card">
                        <img src="https://picsum.photos/id/1027/150/150" alt="Dress Up">
                        <div class="game-title">DRESS UP</div>
                    </div>

                </div>

                <!-- Custom Games Banner -->
                <div class="custom-games-row">
                    <div class="custom-label">CUSTOM GAMES</div>
                    <div class="custom-item"><img src="https://picsum.photos/id/237/100/60" alt="Map"></div>
                    <div class="custom-item"><img src="https://picsum.photos/id/238/100/60" alt="Map"></div>
                    <div class="custom-item"><img src="https://picsum.photos/id/239/100/60" alt="Map"></div>
                    <div class="custom-item"><img src="https://picsum.photos/id/240/100/60" alt="Map"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- 3D Scene Script -->
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x43a8dc); // Sky Color

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // Floating Island (Left Side)
        const islandGroup = new THREE.Group();
        
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x5ebd3e });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0xa86f38 });

        // Build Voxel Island
        for (let x = -3; x <= 3; x++) {
            for (let z = -3; z <= 3; z++) {
                // Grass Top
                const grass = new THREE.Mesh(boxGeo, grassMat);
                grass.position.set(x, 0, z);
                islandGroup.add(grass);

                // Dirt Bottom
                for(let y = 1; y <= 3; y++) {
                    const dirt = new THREE.Mesh(boxGeo, dirtMat);
                    dirt.position.set(x, -y, z);
                    islandGroup.add(dirt);
                }
            }
        }

        // Minecraft Player Model Placeholder
        const playerGroup = new THREE.Group();
        const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x2e86de });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x1b1464 });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
        head.position.y = 1.6;
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), shirtMat);
        body.position.y = 0.7;

        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), pantsMat);
        legs.position.y = -0.3;

        playerGroup.add(head);
        playerGroup.add(body);
        playerGroup.add(legs);
        playerGroup.position.set(0, 1, 0);

        islandGroup.add(playerGroup);
        scene.add(islandGroup);

        // Position Island on Left Side
        islandGroup.position.set(-4, 0, -2);
        islandGroup.rotation.y = 0.6;

        camera.position.set(0, 2, 8);
        camera.lookAt(0, 0, 0);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            islandGroup.rotation.y += 0.003; // Idle Island Rotation
            renderer.render(scene, camera);
        }
        animate();

        // Window Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
