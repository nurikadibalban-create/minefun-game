<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFun.io Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
            user-select: none;
        }

        body {
            background-color: #3b90c7;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 20px;
        }

        .profile-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-tag {
            background: #000;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #333;
        }

        .friends-btn {
            background: #2b3a4e;
            color: #fff;
            border: 2px solid #485f7e;
            border-bottom: 4px solid #141c26;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 38px;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            margin-right: 15px;
        }

        .logo span {
            color: #00d2ff;
        }

        .nav-btn {
            background: #202634;
            color: #fff;
            border: 2px solid #3c4458;
            border-bottom: 4px solid #10131a;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .main-body {
            display: flex;
            justify-content: flex-end;
            padding: 0 20px 20px 0;
            height: calc(100vh - 80px);
        }

        .games-panel {
            width: 660px;
            background: rgba(18, 30, 49, 0.92);
            border-radius: 16px;
            padding: 16px;
            border: 4px solid #283a54;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 100%;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .game-card {
            position: relative;
            background: #1c2838;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 2px solid #324663;
            border-bottom: 4px solid #0f1724;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.1s, border-color 0.1s;
        }

        .game-card:hover {
            transform: scale(1.05);
            border-color: #00d2ff;
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-title {
            position: relative;
            z-index: 2;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 4px 2px;
            text-align: center;
            font-size: 10px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 900;
        }

        .badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #ffcc00;
            color: #000;
            font-size: 8px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 900;
            z-index: 3;
        }
    </style>
</head>
<body>

    <canvas id="canvas-3d"></canvas>

    <div class="ui-overlay">
        <div class="header">
            <div class="profile-box interactive">
                <div class="user-tag">
                    <span style="color:#00ff88; font-size:10px;">🟢</span>
                    NURIPLAYZ
                </div>
                <button class="friends-btn">👥 FRIENDS</button>
            </div>

            <div class="header-right interactive">
                <div class="logo">Mine<span>Fun</span>.io</div>
                <button class="nav-btn" onclick="openGame()">🛒 SHOP</button>
                <button class="nav-btn" onclick="openGame()">🐾 PETS</button>
                <button class="nav-btn">⚙️</button>
            </div>
        </div>

        <div class="main-body">
            <div class="games-panel interactive">
                <div class="games-grid">
                    <div class="game-card" style="background: linear-gradient(135deg, #1b4d3e, #2e8b57);" onclick="openGame('infection')">
                        <span class="badge">POPULAR</span>
                        <div class="game-title">INFECTION</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #2b580c, #639a67);" onclick="openGame('parkour')">
                        <div class="game-title">PARKOUR</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #d35400, #e67e22);" onclick="openGame('creative')">
                        <div class="game-title">CREATIVE</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #2980b9, #3498db);" onclick="openGame('hide-and-seek')">
                        <div class="game-title">HIDE AND SEEK</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #8e44ad, #9b59b6);" onclick="openGame('the-war')">
                        <div class="game-title">THE WAR</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #16a085, #1abc9c);" onclick="openGame('sky-wars')">
                        <div class="game-title">SKY WARS</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #f39c12, #f1c40f);" onclick="openGame('one-block')">
                        <div class="game-title">ONE BLOCK</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #c0392b, #e74c3c);" onclick="openGame('bed-wars')">
                        <div class="game-title">BED WARS</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #27ae60, #2ecc71);" onclick="openGame('sandbox')">
                        <div class="game-title">SANDBOX</div>
                    </div>
                    <div class="game-card" style="background: linear-gradient(135deg, #7f8c8d, #95a5a6);" onclick="openGame('raid')">
                        <div class="game-title">RAID</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Redirection Function ---
        function openGame(mode) {
            window.location.href = "https://minefun.io";
        }

        // --- THREE.JS ENGINE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4ca3dd);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        function createPixelTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = color2;
            for(let i=0; i<32; i++){
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        const grassTex = createPixelTexture('#5caf3d', '#4a9331');
        const dirtTex = createPixelTexture('#866043', '#684a33');
        const stoneTex = createPixelTexture('#737373', '#525252');
        const woodTex = createPixelTexture('#5c4033', '#3d2b22');

        const grassMat = new THREE.MeshLambertMaterial({ map: grassTex });
        const dirtMat = new THREE.MeshLambertMaterial({ map: dirtTex });
        const stoneMat = new THREE.MeshLambertMaterial({ map: stoneTex });
        const woodMat = new THREE.MeshLambertMaterial({ map: woodTex });

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const island = new THREE.Group();

        for (let x = -4; x <= 4; x++) {
            for (let z = -4; z <= 4; z++) {
                const grassBlock = new THREE.Mesh(boxGeo, grassMat);
                grassBlock.position.set(x, 0, z);
                island.add(grassBlock);

                const dirtBlock = new THREE.Mesh(boxGeo, dirtMat);
                dirtBlock.position.set(x, -1, z);
                island.add(dirtBlock);

                if(Math.abs(x) < 3 && Math.abs(z) < 3) {
                    const stoneBlock = new THREE.Mesh(boxGeo, stoneMat);
                    stoneBlock.position.set(x, -2, z);
                    island.add(stoneBlock);
                }
            }
        }

        const trunk = new THREE.Mesh(boxGeo, woodMat);
        trunk.position.set(-2, 1, -2);
        island.add(trunk);
        const trunk2 = new THREE.Mesh(boxGeo, woodMat);
        trunk2.position.set(-2, 2, -2);
        island.add(trunk2);

        for(let lx=-1; lx<=1; lx++){
            for(let lz=-1; lz<=1; lz++){
                for(let ly=3; ly<=4; ly++){
                    const leaf = new THREE.Mesh(boxGeo, grassMat);
                    leaf.position.set(-2+lx, ly, -2+lz);
                    island.add(leaf);
                }
            }
        }

        const player = new THREE.Group();
        const skinMat = new THREE.MeshLambertMaterial({ color: 0xe0ac69 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x3498db });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });

        const head = new THREE.Mesh(boxGeo, skinMat);
        head.scale.set(0.7, 0.7, 0.7);
        head.position.y = 1.4;

        const body = new THREE.Mesh(boxGeo, shirtMat);
        body.scale.set(0.7, 0.8, 0.4);
        body.position.y = 0.65;

        const legs = new THREE.Mesh(boxGeo, pantsMat);
        legs.scale.set(0.7, 0.8, 0.4);
        legs.position.y = -0.15;

        player.add(head);
        player.add(body);
        player.add(legs);

        player.position.set(1, 1.1, 1);
        island.add(player);

        scene.add(island);

        island.position.set(-3.5, 0, -1);
        camera.position.set(0, 3, 9);
        camera.lookAt(-1, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            island.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
