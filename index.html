<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFun.io Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Gadget, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b1522;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* 3D Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Layer Overlay */
        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid #2a3546;
            font-size: 14px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00d2ff;
        }

        .top-right-menu {
            display: flex;
            gap: 8px;
        }

        .btn-top {
            background: #2b3040;
            color: #fff;
            border: 2px solid #454d66;
            border-bottom: 4px solid #181b24;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.1s;
        }

        .btn-top:hover {
            background: #3b4259;
            transform: translateY(-2px);
        }

        /* Main Games Grid Menu */
        .main-content {
            display: flex;
            justify-content: flex-end;
            padding: 10px 40px;
            flex: 1;
        }

        .games-panel {
            width: 620px;
            background: rgba(20, 30, 48, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            padding: 16px;
            border: 3px solid #2c394e;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .game-card {
            position: relative;
            background: #1b2230;
            border-radius: 10px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 2px solid #2e394e;
            border-bottom: 4px solid #111622;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .game-card:hover {
            transform: scale(1.05);
            border-color: #00d2ff;
        }

        .game-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title {
            position: relative;
            z-index: 2;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 6px 2px;
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 1px 1px 2px #000;
        }

        .tag-popular {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #ffcc00;
            color: #000;
            font-size: 8px;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 900;
            z-index: 3;
        }

        /* Custom Games Banner */
        .custom-games-banner {
            grid-column: span 3;
            background: linear-gradient(90deg, #1d2636, #2d3b54);
            border-radius: 10px;
            border: 2px solid #00d2ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            cursor: pointer;
        }

        .custom-games-banner:hover {
            filter: brightness(1.15);
        }

        /* Scrollbar styling */
        .games-panel::-webkit-scrollbar {
            width: 6px;
        }
        .games-panel::-webkit-scrollbar-thumb {
            background: #2e394e;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 3D Scene Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Overlay UI -->
    <div class="ui-container">
        <header class="interactive">
            <div class="user-profile">
                <span style="color:#00ff88;">●</span> NURIPLAYZ
            </div>

            <div class="logo">Mine<span>Fun</span>.io</div>

            <div class="top-right-menu">
                <button class="btn-top">🛒 SHOP</button>
                <button class="btn-top">🐾 PETS</button>
                <button class="btn-top">⚙️</button>
            </div>
        </header>

        <div class="main-content">
            <div class="games-panel interactive">
                <div class="games-grid">
                    
                    <!-- Popular Modes -->
                    <div class="game-card">
                        <span class="tag-popular">POPULAR</span>
                        <img src="https://via.placeholder.com/150/228B22/FFFFFF?text=INFECTION" alt="Infection">
                        <div class="game-title">INFECTION</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/4169E1/FFFFFF?text=PARKOUR" alt="Parkour">
                        <div class="game-title">PARKOUR</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/FF8C00/FFFFFF?text=CREATIVE" alt="Creative">
                        <div class="game-title">CREATIVE</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/8A2BE2/FFFFFF?text=HIDE+SEEK" alt="Hide and Seek">
                        <div class="game-title">HIDE AND SEEK</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/B22222/FFFFFF?text=THE+WAR" alt="The War">
                        <div class="game-title">THE WAR</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/00FFFF/FFFFFF?text=SKY+WARS" alt="Sky Wars">
                        <div class="game-title">SKY WARS</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/FFD700/FFFFFF?text=ONE+BLOCK" alt="One Block">
                        <div class="game-title">ONE BLOCK</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/DC143C/FFFFFF?text=BED+WARS" alt="Bed Wars">
                        <div class="game-title">BED WARS</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/32CD32/FFFFFF?text=SANDBOX" alt="Sandbox">
                        <div class="game-title">SANDBOX</div>
                    </div>

                    <div class="game-card">
                        <img src="https://via.placeholder.com/150/FF1493/FFFFFF?text=RAID" alt="Raid">
                        <div class="game-title">RAID</div>
                    </div>

                </div>

                <!-- Custom Games Section Banner -->
                <div class="custom-games-banner">
                    <div>
                        <div style="font-size: 14px; color: #00d2ff; font-weight: 900;">CUSTOM GAMES</div>
                        <div style="font-size: 10px; color: #aaa;">Play community created maps</div>
                    </div>
                    <button class="btn-top" style="background: #00d2ff; color: #000; border: none;">BROWSE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D World Script -->
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5cb8ff); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Island / Floating Island Platform
        const islandGroup = new THREE.Group();

        // Grass Top Blocks
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x55ac26 });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

        for (let x = -4; x <= 4; x++) {
            for (let z = -4; z <= 4; z++) {
                // Grass Layer
                const grass = new THREE.Mesh(boxGeo, grassMat);
                grass.position.set(x, 0, z);
                islandGroup.add(grass);

                // Dirt Layer
                const dirt = new THREE.Mesh(boxGeo, dirtMat);
                dirt.position.set(x, -1, z);
                islandGroup.add(dirt);
            }
        }

        // Simple Character Model (Steve style)
        const charGroup = new THREE.Group();
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x00a8ff }); // Blue shirt
        const headMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 }); // Skin tone

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
        head.position.y = 1.4;
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), bodyMat);
        body.position.y = 0.5;

        charGroup.add(head);
        charGroup.add(body);
        charGroup.position.set(-1.5, 0.5, 0);

        scene.add(islandGroup);
        scene.add(charGroup);

        // Camera setup overlooking the island from left
        camera.position.set(-5, 3, 6);
        camera.lookAt(0, 0, 0);

        // Animation Loop (Slow rotation for dynamic background)
        function animate() {
            requestAnimationFrame(animate);
            islandGroup.rotation.y += 0.002;
            charGroup.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
